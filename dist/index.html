  <script>
    function initPasswordToggles() {
      const passwordInputs = document.querySelectorAll('input[type="password"], input[data-has-eye="true"]');
      passwordInputs.forEach(input => {
        input.setAttribute('autocomplete', 'new-password');
        input.setAttribute('data-lpignore', 'true');
        if (input.form) input.form.setAttribute('autocomplete', 'off');
        if (input.dataset.eyeAttached) return;
        input.dataset.eyeAttached = "true";
        input.dataset.hasEye = "true";

        let wrapper = input.parentElement;
        if (!wrapper.classList.contains('password-input-wrapper')) {
          wrapper = document.createElement('div');
          wrapper.className = 'password-input-wrapper';
          input.parentNode.insertBefore(wrapper, input);
          wrapper.appendChild(input);
        }

        const eyeBtn = document.createElement('button');
        eyeBtn.type = 'button';
        eyeBtn.className = 'password-toggle-btn';
        eyeBtn.ariaLabel = 'Toggle password visibility';
        eyeBtn.title = 'Show/Hide Password';
        eyeBtn.innerHTML = '👁️';

        eyeBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (input.type === 'password') {
            input.type = 'text';
            eyeBtn.innerHTML = '🙈';
            eyeBtn.style.color = '#f27c07';
          } else {
            input.type = 'password';
            eyeBtn.innerHTML = '👁️';
            eyeBtn.style.color = '#64748b';
          }
        });

        wrapper.appendChild(eyeBtn);
      });
    }

    function removeOptionButtons() {
      document.querySelectorAll('.theme-toggle-btn, .land-nav__btn-icon, .lang-selector').forEach(el => {
        if (el.parentElement && el.parentElement.children.length === 1 && el.parentElement.style && el.parentElement.style.position === 'relative') {
          el.parentElement.remove();
        }
        el.remove();
      });
    }

    const observer = new MutationObserver(() => {
      initPasswordToggles();
      removeOptionButtons();
    });
    document.addEventListener('DOMContentLoaded', () => {
      initPasswordToggles();
      removeOptionButtons();
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>

  <script>
    (function() {
      const API_BASE = "http://localhost:5050/serial";
      let pollTimer = null;
      let lastMessageCount = 0;

      const fab = document.getElementById("tmSerialFab");
      const topBtn = document.getElementById("tmSerialTopBtn");
      const fabDot = document.getElementById("tmSerialFabDot");
      const overlay = document.getElementById("tmSerialOverlay");
      const closeBtn = document.getElementById("tmSerialCloseBtn");
      const portSelect = document.getElementById("tmSerialPortSelect");
      const refreshBtn = document.getElementById("tmSerialRefreshBtn");
      const baudSelect = document.getElementById("tmSerialBaudSelect");
      const connectBtn = document.getElementById("tmSerialConnectBtn");
      const disconnectBtn = document.getElementById("tmSerialDisconnectBtn");
      const statusText = document.getElementById("tmSerialStatusText");
      const portInfo = document.getElementById("tmSerialPortInfo");
      const writeInput = document.getElementById("tmSerialWriteInput");
      const sendBtn = document.getElementById("tmSerialSendBtn");
      const consoleBox = document.getElementById("tmSerialConsole");
      const clearBtn = document.getElementById("tmSerialClearBtn");

      function openModal() {
        overlay.classList.add("open");
        loadPorts();
        checkStatus();
      }

      fab.addEventListener("click", openModal);
      if (topBtn) topBtn.addEventListener("click", openModal);

      window.addEventListener("keydown", (e) => {
        if (e.altKey && (e.key === "s" || e.key === "S" || e.key === "h" || e.key === "H")) {
          e.preventDefault();
          if (overlay.classList.contains("open")) {
            overlay.classList.remove("open");
          } else {
            openModal();
          }
        }
      });

      closeBtn.addEventListener("click", () => {
        overlay.classList.remove("open");
      });

      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) {
          overlay.classList.remove("open");
        }
      });

      refreshBtn.addEventListener("click", (e) => {
        e.preventDefault();
        loadPorts();
      });

      async function loadPorts() {
        try {
          const res = await fetch(`${API_BASE}/ports`);
          const json = await res.json();
          if (json.success && json.data && json.data.ports) {
            const currentVal = portSelect.value;
            portSelect.innerHTML = '<option value="">Select COM Port...</option>';
            json.data.ports.forEach(p => {
              const opt = document.createElement("option");
              opt.value = p.port;
              opt.textContent = `${p.port} (${p.description})`;
              if (p.port === currentVal) opt.selected = true;
              portSelect.appendChild(opt);
            });
          }
        } catch (err) {
          console.warn("PySerial not detected or blocked on HTTPS; loading Virtual Demo COM Ports");
          const virtualPorts = [
            { port: "COM10", description: "Virtual RFID Scanner (Tuition Meet)" },
            { port: "COM11", description: "Virtual Biometric Sensor" },
            { port: "COM12", description: "Virtual Arduino Serial Port" }
          ];
          portSelect.innerHTML = '<option value="">Select COM Port...</option>';
          virtualPorts.forEach(p => {
            const opt = document.createElement("option");
            opt.value = p.port;
            opt.textContent = `${p.port} (${p.description})`;
            portSelect.appendChild(opt);
          });
        }
      }

      connectBtn.addEventListener("click", async () => {
        const port = portSelect.value;
        const baudRate = parseInt(baudSelect.value, 10);
        if (!port) {
          alert("Please select a COM Port first.");
          return;
        }
        connectBtn.disabled = true;
        connectBtn.textContent = "Connecting...";
        try {
          const res = await fetch(`${API_BASE}/connect`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ port: port, baud_rate: baudRate })
          });
          const json = await res.json();
          if (json.success) {
            updateStatusUI(true, port, baudRate, false, null);
            startPolling();
          } else {
            const errDetail = json.error || "Unknown error";
            updateStatusUI(false, null, null, false, `${errDetail} (Check USB cable or select active COM port)`);
            connectBtn.disabled = false;
            connectBtn.innerHTML = "<span>⚡ Connect Hardware</span>";
          }
        } catch (err) {
          // Automatic Virtual Demo Mode on Vercel / HTTPS
          updateStatusUI(true, port, baudRate, false, null);
          statusText.textContent = "Connected (Virtual Demo)";
          statusText.style.color = "#22c55e";
          portInfo.textContent = `${port} @ ${baudRate} bps (Virtual Hardware Mode)`;
          portInfo.style.color = "#38bdf8";
          appendConsoleLine(`>>> [⚡ VIRTUAL PySERIAL CONNECTED] Active on ${port} @ ${baudRate} bps`);
          appendConsoleLine(`>>> [READY] Hardware Simulation Mode enabled for Vercel demo!`);
          appendConsoleLine(`>>> Click "⚡ Simulate RFID Check-in" below to test student check-in!`);
          connectBtn.disabled = true;
          connectBtn.innerHTML = "<span>⚡ Connect Hardware</span>";
          disconnectBtn.disabled = false;
        }
      });

      disconnectBtn.addEventListener("click", async () => {
        disconnectBtn.disabled = true;
        try {
          const res = await fetch(`${API_BASE}/disconnect`, { method: "POST" });
          const json = await res.json();
          if (json.success) {
            updateStatusUI(false, null, null, false, null);
            stopPolling();
          }
        } catch (err) {
          console.error("Disconnect error:", err);
        }
      });

      sendBtn.addEventListener("click", async () => {
        const payload = writeInput.value.trim();
        if (!payload) return;
        try {
          const res = await fetch(`${API_BASE}/write`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ payload: payload + "\n", is_hex: false })
          });
          const json = await res.json();
          if (json.success) {
            writeInput.value = "";
            appendConsoleLine(`>>> SENT: ${payload}`);
          } else {
            appendConsoleLine(`[ERROR] Send failed: ${json.error}`);
          }
        } catch (err) {
          appendConsoleLine(`[ERROR] Network error while sending command.`);
        }
      });

      clearBtn.addEventListener("click", () => {
        consoleBox.innerHTML = "";
      });

      const simulateBtn = document.getElementById("tmSerialSimulateBtn");
      if (simulateBtn) {
        simulateBtn.addEventListener("click", async () => {
          const sampleMessage = "RFID_READ: Student [David Josva] Checked In - Attendance Verified";
          try {
            await fetch("http://localhost:5050/serial/inject", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: sampleMessage })
            });
          } catch (err) {
            appendConsoleLine(`RAW: ${sampleMessage} (HEX: 52 46 49 44 5f 52 45 41 44)`);
            const banner = document.getElementById("tmSerialAttendanceBanner");
            const nameEl = document.getElementById("tmAttendanceStudentName");
            const timeEl = document.getElementById("tmAttendanceTimeText");
            if (banner && nameEl && timeEl) {
              nameEl.textContent = sampleMessage;
              timeEl.textContent = `Attendance verified via Serial Scanner @ ${new Date().toLocaleTimeString()}`;
              banner.style.display = "flex";
              appendConsoleLine(`>>> [📋 ATTENDANCE REGISTERED] ✅ Student Marked PRESENT in Tuition Meet Register!`);
            }
          }
        });
      }


      function appendConsoleLine(text) {
        const div = document.createElement("div");
        div.className = "tm-serial-console-line";
        const timeSpan = document.createElement("span");
        timeSpan.className = "tm-serial-console-time";
        const now = new Date();
        timeSpan.textContent = `[${now.toTimeString().split(' ')[0]}]`;
        div.appendChild(timeSpan);
        div.appendChild(document.createTextNode(text));
        consoleBox.appendChild(div);
        consoleBox.scrollTop = consoleBox.scrollHeight;
      }

      function updateStatusUI(connected, port, baud, reconnecting, errorMsg) {
        fabDot.className = "tm-serial-dot";
        if (connected) {
          fabDot.classList.add("connected");
          statusText.style.color = "#22c55e";
          statusText.textContent = "Connected";
          portInfo.textContent = `${port} @ ${baud} bps`;
          connectBtn.disabled = true;
          connectBtn.innerHTML = "<span>⚡ Connect Hardware</span>";
          disconnectBtn.disabled = false;
        } else if (reconnecting) {
          fabDot.classList.add("reconnecting");
          statusText.style.color = "#f59e0b";
          statusText.textContent = "Reconnecting...";
          portInfo.textContent = `Waiting for device on ${port}...`;
          connectBtn.disabled = false;
          disconnectBtn.disabled = false;
        } else {
          statusText.style.color = "#ef4444";
          statusText.textContent = errorMsg ? "Connection Failed" : "Disconnected";
          portInfo.textContent = errorMsg ? errorMsg : "No hardware connected";
          portInfo.style.color = errorMsg ? "#f87171" : "#94a3b8";
          connectBtn.disabled = false;
          connectBtn.innerHTML = "<span>⚡ Connect Hardware</span>";
          disconnectBtn.disabled = true;
        }
      }

      async function checkStatus() {
        try {
          const res = await fetch(`${API_BASE}/status`);
          const json = await res.json();
          if (json.success && json.data && json.data.status) {
            const st = json.data.status;
            updateStatusUI(st.connected, st.port, st.baud_rate, st.reconnecting, st.error);
            if (st.connected || st.reconnecting) {
              startPolling();
            }
          }
        } catch (err) {
          updateStatusUI(false, null, null, false, "Virtual Hardware Simulation Ready (Select COM10 & Connect)");
        }
      }

      async function pollLatestData() {
        try {
          const res = await fetch(`${API_BASE}/latest-data?limit=50`);
          const json = await res.json();
          if (json.success && json.data && json.data.messages) {
            const msgs = json.data.messages;
            if (msgs.length > lastMessageCount) {
              const newMsgs = msgs.slice(lastMessageCount);
              newMsgs.forEach(m => {
                appendConsoleLine(`RAW: ${m.raw} (HEX: ${m.hex})`);
                // Auto Student Attendance / RFID check-in detector
                if (m.raw && (m.raw.includes("RFID_READ") || m.raw.includes("BARCODE_SCAN") || m.raw.includes("Checked In") || m.raw.includes("Student"))) {
                  const banner = document.getElementById("tmSerialAttendanceBanner");
                  const nameEl = document.getElementById("tmAttendanceStudentName");
                  const timeEl = document.getElementById("tmAttendanceTimeText");
                  if (banner && nameEl && timeEl) {
                    nameEl.textContent = m.raw.replace(/(\r\n|\n|\r)/gm, "");
                    timeEl.textContent = `Attendance verified via Serial Scanner @ ${new Date().toLocaleTimeString()}`;
                    banner.style.display = "flex";
                    appendConsoleLine(`>>> [📋 ATTENDANCE REGISTERED] ✅ Student Marked PRESENT in Tuition Meet Register!`);
                    // Call backend API to record attendance
                    fetch("/api/attendance/serial-checkin", {
                      method: "POST",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify({ scanData: m.raw })
                    }).catch(e => console.log("Attendance backend log info:", e));
                  }
                }
              });
              lastMessageCount = msgs.length;
            }
          }
        } catch (err) {
          console.error("Data poll error:", err);
        }
      }

      function startPolling() {
        if (!pollTimer) {
          pollTimer = setInterval(() => {
            checkStatus();
            pollLatestData();
          }, 1000);
        }
      }

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
        lastMessageCount = 0;
      }

      // Initial check on load
      setTimeout(checkStatus, 1500);
    })();
  </script>

</body>
</html>
